<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>

    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- fontawesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- daisyUI cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#F8FAFC] space-y-16 min-h-screen">

    <!-- dashboard -->
    <section id="dashboard" class="max-w-6xl mx-auto px-4 pt-16">
        <h2 class="font-bold text-5xl md:text-6xl mb-5 text-center md:text-left">Job Application Tracker</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 justify-items-center">
            <div class="bg-white w-full max-w-sm rounded-lg p-5 shadow-sm">
                <p class="text-[#020202] font-medium mb-3 text-2xl">Total</p>
                <p id="total-count" class="font-bold text-2xl">0</p>
            </div>
            <div class="bg-white w-full max-w-sm rounded-lg p-5 shadow-sm">
                <p class="text-[#323B49] font-medium mb-3 text-2xl">Interview</p>
                <p id="interview-count" class="font-bold text-2xl text-green-500">0</p>
            </div>
            <div class="bg-white w-full max-w-sm rounded-lg p-5 shadow-sm">
                <p class="text-[#323B49] font-medium mb-3 text-2xl">Rejected</p>
                <p id="rejected-count" class="font-bold text-2xl text-red-500">0</p>
            </div>
        </div>
    </section>


    
</body>
</html>
